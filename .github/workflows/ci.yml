name: AppServer CI

on:
  pull_request:
    paths:
      - '**/*Tests/**'
      - '*.sln'

permissions:
  contents: read
  pull-requests: write

env:
  DIR: ./
  DOTNET_VERSION: '7.0.x'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: ${{ env.DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.DIR }}
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        working-directory: ${{ env.DIR }}
        run: |
          dotnet test --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
          # Debug: Show what coverage files were generated
          echo "Coverage files generated:"
          find ./coverage -name "*.xml" -o -name "coverage*" | head -20

      - name: Generate Coverage Report & Enforce 90% Threshold
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: '**/coverage.cobertura.xml'
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '90 90'

      - name: Debug - Check if coverage report exists
        if: always()
        run: |
          if [ -f code-coverage-results.md ]; then
            echo "Report file exists"
            cat code-coverage-results.md
          else
            echo "Report file NOT found. Current directory contents:"
            ls -la
          fi

      - name: Post Coverage Report to PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          recreate: true
          path: code-coverage-results.md
