name: AppServer CI

on:
  pull_request:
    paths:
      - '**/*Tests/**'
      - '*.sln'

permissions:
  contents: read
  pull-requests: write

env:
  DIR: ./
  DOTNET_VERSION: '7.0.x'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check if solution file exists
        id: check-solution
        run: |
          if ls ${{ env.DIR }}*.sln 1> /dev/null 2>&1; then
            echo "solution_exists=true" >> $GITHUB_OUTPUT
          else
            echo "solution_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        if: steps.check-solution.outputs.solution_exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        if: steps.check-solution.outputs.solution_exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        if: steps.check-solution.outputs.solution_exists == 'true'
        working-directory: ${{ env.DIR }}
        run: dotnet restore

      - name: Build
        if: steps.check-solution.outputs.solution_exists == 'true'
        working-directory: ${{ env.DIR }}
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        if: steps.check-solution.outputs.solution_exists == 'true'
        working-directory: ${{ env.DIR }}
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate Coverage Report & Enforce 90% Threshold
        if: steps.check-solution.outputs.solution_exists == 'true'
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '90 90'

      - name: Post Coverage Report to PR
        if: always() && steps.check-solution.outputs.solution_exists == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
